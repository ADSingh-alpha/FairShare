<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SplitNest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand auth-brand" href="login.html"><span class="brand-mark">S</span><span>SplitNest</span></a>
    <div class="auth-copy"><p class="eyebrow">Get started</p><h1>Create your account</h1><p>Start sharing expenses fairly with your group.</p></div>
    <form id="registerForm" novalidate>
      <label>Full name<input type="text" id="registerName" placeholder="XYZ" required></label>
      <label>Email address<input type="email" id="registerEmail" placeholder="EXAMPLE@example.com" required></label>
      <label>Password<input type="password" id="registerPassword" minlength="6" placeholder="Minimum 6 characters" required></label>
      <p class="form-error" id="registerError"></p>
      <button class="btn btn-primary btn-full" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
  </main>
  <aside class="auth-art">
    <div class="auth-art-inner"><span class="auth-orbit orbit-one"></span><span class="auth-orbit orbit-two"></span><div class="auth-stat"><span>Smart splitting</span><strong>3 ways</strong><small>Equal, percentage, or custom</small></div></div>
  </aside>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
